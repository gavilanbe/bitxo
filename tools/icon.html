<!DOCTYPE html>
<!-- Genera los iconos de la PWA desde el arte real del juego.
     ?size=512|192|180|32   ?maskable=1 (zona segura para Android)
     Se pinta una escena de 64x64 píxeles lógicos y se escala entera:
     pixel art nítido a cualquier tamaño. -->
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="icon"></canvas>
<script src="../src/config.js"></script>
<script src="../src/core/color.js"></script>
<script src="../src/core/sprites.js"></script>
<script src="../src/data/species.js"></script>
<script src="../src/data/pixelart.js"></script>
<script src="../src/data/lines/pradera.js"></script>
<script src="../src/data/lines/brasa.js"></script>
<script src="../src/data/lines/marea.js"></script>
<script src="../src/data/lines/fungo.js"></script>
<script src="../src/data/lines/petrea.js"></script>
<script src="../src/data/lines/voltio.js"></script>
<script src="../src/data/lines/astro.js"></script>
<script src="../src/data/lines/grimo.js"></script>
<script>
/* lo que el juego define en render/scene.js y hace falta para sombrear huevos */
function _rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function lerpHexA(a,b,t){ const A=_rgb(a),B=_rgb(b),f=v=>('0'+Math.round(v).toString(16)).slice(-2); return '#'+f(A[0]+(B[0]-A[0])*t)+f(A[1]+(B[1]-A[1])*t)+f(A[2]+(B[2]-A[2])*t); }
function darkHex(a,k){ return lerpHexA(a,'#0a0818',k); }
function lightHex(a,k){ return lerpHexA(a,'#fff6dc',k); }
buildAllSprites();

const Q = new URLSearchParams(location.search);
const SIZE = +(Q.get('size')||512), MASK = !!Q.get('maskable');
const N = 64;                       /* lienzo lógico */
const c = document.createElement('canvas'); c.width = N; c.height = N;
const g = c.getContext('2d');
const B4 = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const P = (x,y,w,h,col)=>{ g.fillStyle=col; g.fillRect(x,y,w,h); };

/* cielo de hora dorada con tramado */
const SK = [[0,'#2a2466'],[22,'#8a4a8a'],[40,'#f08a5a'],[48,'#ffcf7a']];
for(let y=0;y<48;y++){
  let i=0; while(i<SK.length-2 && y>=SK[i+1][0]) i++;
  const f = (y-SK[i][0])/(SK[i+1][0]-SK[i][0]);
  for(let x=0;x<N;x++){
    const q = f*4, lo = Math.floor(q), fr = q-lo;
    const lv = (B4[(y&3)*4+(x&3)]/16 < fr) ? lo+1 : lo;
    P(x,y,1,1, lerpHexA(SK[i][1], SK[i+1][1], Math.min(1,lv/4)));
  }
}
/* sol enorme con halo tramado */
const sx = 44, sy = 30;
for(let y=-14;y<=14;y++) for(let x=-14;x<=14;x++){
  const d = Math.sqrt(x*x+y*y);
  if(d<=6.5) P(sx+x,sy+y,1,1, d<3.5 ? '#fff6c0' : '#ffe066');
  else if(d<14 && B4[((y+16)&3)*4+((x+16)&3)]/16 < (1-(d-6.5)/7.5)*0.55) P(sx+x,sy+y,1,1,'#ffd08a');
}
/* estrellas del lado nocturno */
for(const s of [[6,5],[15,10],[26,4],[9,16],[33,12]]) P(s[0],s[1],1,1,'#e8e0ff');
P(20,7,1,3,'#fff8d0'); P(19,8,3,1,'#fff8d0');
/* colinas en capas con arboleda */
const hill = (base, amp, seed, col, hi)=>{ for(let x=0;x<N;x++){ const y = Math.round(base - amp*(0.6*Math.sin(x/9+seed)+0.4*Math.sin(x/4.3+seed*2))); P(x,y,1,N-y,col); P(x,y,1,1,hi); } };
hill(44, 3, 1.2, '#6a5a8a', '#8a78a8');
hill(48, 2, 4.0, '#3d6b52', '#57875f');
for(const t of [[6,45],[13,44],[52,46],[58,45]]){ P(t[0]-2,t[1]-3,5,3,'#2e5440'); P(t[0]-1,t[1]-4,3,1,'#2e5440'); P(t[0]-1,t[1]-3,1,1,'#57875f'); }
/* prado con luz rasante */
for(let y=50;y<N;y++) for(let x=0;x<N;x++){
  const lv = (B4[(y&3)*4+(x&3)]/16 < (y-50)/14) ? 1 : 0;
  P(x,y,1,1, lv ? '#3a8a4c' : '#5aa860');
}
for(let i=0;i<14;i++){ const x=(i*23+5)%62+1, y=52+(i*7)%10; P(x,y,1,2,'#2e7040'); P(x,y-1,1,1,'#8ad07a'); }
/* florecitas */
for(const f of [[8,58,'#f2a2b8'],[55,60,'#ffd94a'],[18,62,'#fff8d0']]){ P(f[0],f[1],1,1,f[2]); }

/* protagonista: BROTIN a 3x, con sombra y brillo de contorno */
const spr = SPR.pradera_babyA[0];
const sc = MASK ? 2 : 3;
const w = spr.width*sc, h = spr.height*sc;
const px0 = Math.round(N/2 - w/2), py0 = (MASK ? 54 : 57) - h;
P(px0+sc, py0+h-1, w-2*sc, 2, 'rgba(20,30,20,0.45)');
/* aura dorada: silueta desplazada */
const sil = document.createElement('canvas'); sil.width = spr.width; sil.height = spr.height;
const sg = sil.getContext('2d'); sg.drawImage(spr,0,0); sg.globalCompositeOperation='source-in'; sg.fillStyle='#fff3b0'; sg.fillRect(0,0,99,99);
g.imageSmoothingEnabled = false;
for(const d of [[-1,0],[1,0],[0,-1],[0,1]]) g.drawImage(sil, px0+d[0], py0+d[1], w, h);
g.drawImage(spr, px0, py0, w, h);
/* chispas */
const spark = (x,y,col)=>{ P(x,y-2,1,5,col); P(x-2,y,5,1,col); P(x,y,1,1,'#ffffff'); };
spark(MASK?14:9, MASK?40:36, '#ffd94a');
spark(MASK?50:56, MASK?45:48, '#fff8d0');
/* huevo cascado a su lado (de donde salió) */
if(!MASK){
  const egg = SPR.egg_pradera[0];
  g.drawImage(egg, 6, 60-egg.height);
}

/* pantalla de arranque de iOS: ?splash=W,H → cielo a sangre, escena centrada y el título */
const SPL = Q.get('splash');
if(SPL){
  const [W,H] = SPL.split(',').map(Number);
  const out = document.getElementById('icon'); out.width = W; out.height = H;
  const o = out.getContext('2d'); o.imageSmoothingEnabled = false;
  /* fondo: la franja superior e inferior de la escena estiradas */
  const k = Math.floor(W/N);
  const ox = Math.round(W/2 - N*k/2), oy = Math.round(H*0.56 - N*k/2);
  o.fillStyle = '#2a2466'; o.fillRect(0,0,W,oy+2);
  o.fillStyle = '#3a8a4c'; o.fillRect(0,oy+N*k-2,W,H);
  /* estrellas en el cielo alto */
  for(let i=0;i<22;i++){ const sx2=(i*397+61)%W, sy2=(i*211+37)%Math.max(1,oy-k); o.fillStyle = i%3?'#e8e0ff':'#8a82c8'; o.fillRect(sx2, sy2, k*(i%4?1:2)/2|0||2, k*(i%4?1:2)/2|0||2); }
  o.drawImage(c, 0,0,1,N, 0,oy,ox,N*k); o.drawImage(c, N-1,0,1,N, ox+N*k,oy,W,N*k);
  o.drawImage(c, ox, oy, N*k, N*k);
  /* título con la fuente del juego a escala entera */
  const F = {B:'110101110101110',I:'111010010010111',T:'111010010010010',X:'101101010101101',O:'010101101101010'};
  const word = 'BITXO', ts = Math.max(4, Math.floor(k*0.9)), tw = word.length*4*ts - ts;
  let tx = Math.round(W/2 - tw/2); const ty = Math.round(oy*0.45);
  for(const ch of word){ const gl = F[ch];
    for(let p=0;p<15;p++) if(gl[p]==='1'){ o.fillStyle = '#1a1428'; o.fillRect(tx+(p%3)*ts+ts/2, ty+Math.floor(p/3)*ts+ts/2, ts, ts); }
    for(let p=0;p<15;p++) if(gl[p]==='1'){ o.fillStyle = '#ffd94a'; o.fillRect(tx+(p%3)*ts, ty+Math.floor(p/3)*ts, ts, ts); }
    tx += 4*ts; }
  document.title = 'ICON-READY';
  throw 'splash';
}
/* escalado entero al tamaño pedido */
const out = document.getElementById('icon');
out.width = SIZE; out.height = SIZE;
const o = out.getContext('2d'); o.imageSmoothingEnabled = false;
if(SIZE>=N){
  /* 180 (iOS) = el de 192 recortado 6px por lado: sigue siendo x3 nítido */
  const k = SIZE===180 ? 3 : Math.floor(SIZE/N), off = Math.floor((SIZE-N*k)/2);
  o.fillStyle = '#2a2466'; o.fillRect(0,0,SIZE,SIZE);
  o.drawImage(c, off, off, N*k, N*k);
  /* 180 y 192 no son múltiplos de 64: relleno el borde con el mismo cielo/prado */
  if(off>0 && SIZE!==180){ o.drawImage(c, 0,0,N,1, 0,0,SIZE,off); o.drawImage(c, 0,N-1,N,1, 0,SIZE-off,SIZE,off); o.drawImage(c,0,0,1,N,0,off,off,N*k); o.drawImage(c,N-1,0,1,N,SIZE-off,off,off,N*k); }
} else {
  /* favicon: el bitxo a 2x sobre una franja de cielo y prado */
  o.drawImage(c, 0, 8, N, N, 0, 0, SIZE*2, SIZE*2);
  o.fillStyle = '#5aa860'; o.fillRect(0, SIZE-5, SIZE, 5);
  const s2 = SPR.pradera_babyA[0], w2 = s2.width*2, h2 = s2.height*2;
  o.drawImage(s2, Math.round(SIZE/2-w2/2), SIZE-2-h2, w2, h2);
}
document.title = 'ICON-READY';
</script></body></html>
